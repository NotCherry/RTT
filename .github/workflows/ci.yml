name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs can stop; default-branch and merge-queue runs must finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --check --oneline HEAD
          fi
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint:1.7.12 -color
      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(git ls-files -z '*.sh')
      - name: Test local infrastructure
        run: python3 -m unittest discover -s infra/tests -v
      - name: Validate Compose configurations
        run: |
          for file in infra/docker-compose.yml infra/docker-compose.dev.yml infra/docker-compose.robot.yml; do
            docker compose --project-directory . -f "$file" config --quiet
          done
          docker compose --project-directory . -f infra/docker-compose.yml -f infra/docker-compose.ci.yml config --quiet
          docker compose --project-directory . -f infra/docker-compose.yml -f infra/docker-compose.preview.yml --profile preview config --quiet

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint:design
      - run: npm run test:unit -- --reporter=default --reporter=junit --outputFile=test-results/unit.xml
      - run: npm run build
      - name: Save unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-test-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  api:
    name: API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests --junitxml=test-results/pytest.xml
      - name: Save test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: apps/api/test-results/
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Container and browser integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_FILE: infra/docker-compose.yml:infra/docker-compose.ci.yml
      COMPOSE_PROJECT_NAME: rtt-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: docker/setup-buildx-action@v4
      - name: Build API simulation image
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          target: simulation
          load: true
          tags: rtt-api:ci
          cache-from: type=gha,scope=api-simulation
          cache-to: type=gha,mode=max,scope=api-simulation
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          load: true
          tags: rtt-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Start isolated simulation stack
        run: docker compose --project-directory . up -d --no-build --wait --wait-timeout 120
      - name: Check API through Nginx
        run: curl --fail --show-error --silent http://localhost:8080/api/health
      - name: Cache the Cypress browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/web/package-lock.json') }}
      - name: Install browser test dependencies
        working-directory: apps/web
        run: npm ci
      - name: Test the production web and API images together
        working-directory: apps/web
        run: npm run test:e2e -- --browser electron --spec cypress/e2e/stack-smoke.cy.ts --config video=true --reporter junit --reporter-options 'mochaFile=test-results/production-[hash].xml,toConsole=true'
      # Camera perception fixtures intercept Vite modules; keep their existing seam.
      - name: Run all browser journeys through Vite and the API container
        working-directory: apps/web
        run: |
          mkdir -p test-results
          npm run dev -- --host 127.0.0.1 --strictPort > test-results/vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for _ in {1..60}; do
            kill -0 "$vite_pid"
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          npm run test:e2e -- --browser electron --config baseUrl=http://localhost:5173,video=true,trashAssetsBeforeRuns=false --reporter junit --reporter-options 'mochaFile=test-results/e2e-[hash].xml,toConsole=true'
      - name: Collect container diagnostics
        if: ${{ !cancelled() }}
        run: |
          mkdir -p test-results
          docker compose --project-directory . ps -a > test-results/compose-status.txt
          docker compose --project-directory . logs --no-color > test-results/compose.log 2>&1
      - name: Save browser and container diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: |
            test-results/
            apps/web/test-results/
            apps/web/cypress/screenshots/
            apps/web/cypress/videos/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove CI containers and disposable data
        if: ${{ always() }}
        run: docker compose --project-directory . down --volumes --remove-orphans

  # Require this single, stable check in the default branch's ruleset.
  ci:
    name: CI passed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [infrastructure, web, api, integration]
    if: ${{ always() }}
    steps:
      - name: Require every check to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ['JOB_RESULTS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('| Check | Result |\n| --- | --- |\n')
              for name, job in results.items():
                  summary.write(f"| {name} | {job['result']} |\n")
          sys.exit(0 if all(job['result'] == 'success' for job in results.values()) else 1)
          PY
