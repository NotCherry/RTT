name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests

  docker:
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose --project-directory . -f infra/docker-compose.yml config
      - run: docker compose --project-directory . -f infra/docker-compose.yml build

  deploy-render:
    name: Trigger Render production deployments
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
      RENDER_WEB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}
    steps:
      - name: Require Render deploy hooks
        run: |
          test -n "$RENDER_API_DEPLOY_HOOK_URL"
          test -n "$RENDER_WEB_DEPLOY_HOOK_URL"
      - name: Deploy the API revision
        run: curl --fail --show-error --silent --request POST "${RENDER_API_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
      - name: Deploy the web revision
        run: curl --fail --show-error --silent --request POST "${RENDER_WEB_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
