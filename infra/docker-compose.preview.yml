# Isolated local preview stack for checking pull-request changes.
# Usage: docker compose --project-directory . -f infra/docker-compose.yml -f infra/docker-compose.preview.yml --profile preview up -d
services:
  backend-preview:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    volumes:
      - robot-data-preview:/app/data
    ports:
      - "${PREVIEW_BACKEND_PORT:-8101}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    profiles: ["preview"]
  frontend-preview:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "${PREVIEW_FRONTEND_PORT:-8100}:80"
    volumes:
      - ./apps/web/nginx.preview.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-preview:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    profiles: ["preview"]

volumes:
  robot-data-preview:
