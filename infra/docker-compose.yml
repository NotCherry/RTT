services:
  backend:
    build: apps/api
    environment:
      RTT_CAMERA_SOURCES: ${RTT_CAMERA_SOURCES:-}
    volumes:
      - robot-data:/app/data
    ports:
      - "0.0.0.0:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
  frontend:
    build: apps/web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "0.0.0.0:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  robot-data:
