# Run only the simulation images built by CI. All data is disposable.
services:
  backend:
    image: rtt-api:ci
    build:
      target: simulation
    environment:
      RTT_CAMERA_SOURCES: ''
    healthcheck:
      test: [CMD-SHELL, "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
  frontend:
    image: rtt-web:ci
